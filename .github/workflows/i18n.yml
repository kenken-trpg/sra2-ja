name: i18n

# The locale checks and the test suite guard different things, so both need to
# run whenever either the strings or the code around them change.
on:
  push:
    paths:
      - 'public/lang/**'
      - 'public/system.json'
      - 'public/templates/**'
      - 'public/style/**'
      - 'public/icons/nav/**'
      - 'src/**'
      - 'tools/i18n/**'
      - 'tools/release/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - 'vite.config.mts'
      - 'tsconfig.json'
      - '.github/workflows/i18n.yml'
  pull_request:
    paths:
      - 'public/lang/**'
      - 'public/system.json'
      - 'public/templates/**'
      - 'public/style/**'
      - 'public/icons/nav/**'
      - 'src/**'
      - 'tools/i18n/**'
      - 'tools/release/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - 'vite.config.mts'
      - 'tsconfig.json'
      - '.github/workflows/i18n.yml'
  workflow_dispatch:

jobs:
  locale:
    name: Locale checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # These checks are dependency-free, so no install step is needed.
      - name: Progress report
        run: npm run i18n:scan
      - name: Key, placeholder and markup integrity
        run: npm run check:i18n
      - name: Japanese label layout budget
        run: npm run check:layout
      - name: Fail if the locale drifted from en.json
        run: |
          npm run i18n:sync
          git diff --exit-code -- public/lang/ja.json || {
            echo "::error::public/lang/ja.json is out of sync with en.json. Run 'npm run i18n:sync' and commit."
            exit 1
          }

  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # vitest needs the dev dependencies, unlike the locale checks above.
      - name: Install
        run: npm ci
      - name: Type-check the project
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      # system.json loads index.mjs, and Foundry derives sheet ids from the
      # class names, so both must survive bundling and minification.
      - name: Check the bundle's entry file and class names
        run: |
          test -f dist/index.mjs || { echo "::error::dist/index.mjs was not built"; exit 1; }
          test -f dist/style/sra2.css || { echo "::error::dist/style/sra2.css was not built"; exit 1; }
          for name in CharacterSheetV2 VehicleSheet IceSheet ServerSheet FeatSheet SkillSheet SpecializationSheet MetatypeSheet SRA2Actor SRA2Item; do
            grep -q "class $name[ {]" dist/index.mjs || { echo "::error::class name $name was lost in the bundle"; exit 1; }
          done
